# Supabase free projects pause after 7 days without activity.
# This pings the database every 3 days so the website never falls asleep.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS "https://itynuuiypiegtcudunre.supabase.co/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: sb_publishable_1wrHAElSry6qtzybkHBVVA_vlZCYoIZ" > /dev/null
          echo "Supabase is awake"
