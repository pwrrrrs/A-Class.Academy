<!doctype html>
<html lang="th" data-tone="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Class Academy | กวดวิชาลำพูน คณิต เคมี ชีวะ อังกฤษ</title>
<meta name="description" content="สถาบันกวดวิชา A-Class Academy ลำพูน เรียนกลุ่มเล็ก คณิต เคมี ชีวะ อังกฤษ ม.1–ม.6 ติวสอบเข้า ม.1 ม.4 และมหาวิทยาลัย เรียนออนไลน์ได้ทั่วประเทศ">
<meta property="og:title" content="A-Class Academy | กวดวิชาลำพูน">
<meta property="og:description" content="เรียนกลุ่มเล็ก เข้าใจจริง คะแนนขึ้นจริง">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main>
  <div class="wrap">
    <section class="hero" id="top">
      <div class="stack" style="gap:24px">
        <span class="pill" style="align-self:flex-start" data-i18n="hero.pill">สถาบันกวดวิชาที่ลำพูน · เรียนออนไลน์ได้ทั่วประเทศ</span>
        <h1 data-i18n-html="hero.title">เรียนกลุ่มเล็ก<br>เข้าใจจริง <em>คะแนนขึ้นจริง</em></h1>
        <ul class="checks hero-points">
          <li><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span><strong data-i18n="hero.p1t"></strong><span class="muted" data-i18n="hero.p1b"></span></span></li>
          <li><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span><strong data-i18n="hero.p2t"></strong><span class="muted" data-i18n="hero.p2b"></span></span></li>
          <li><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span><strong data-i18n="hero.p3t"></strong><span class="muted" data-i18n="hero.p3b"></span></span></li>
        </ul>
        <p class="hero-promo"><strong data-i18n="hero.promo"></strong> <span data-i18n="hero.promo2"></span></p>
        <div class="row">
          <a href="#courses" class="btn btn-brand" data-i18n="hero.cta">ดูคอร์สทั้งหมด</a>
          <a href="#contact" class="btn btn-accent" id="heroLine" data-i18n="hero.cta2">ทักไลน์ปรึกษาฟรี</a>
        </div>
        <div class="stats">
          <div><div class="stat-num">80%</div><div class="stat-label" data-i18n="stat.1"></div></div>
          <div><div class="stat-num" data-i18n="stat.2n">6 ปี</div><div class="stat-label" data-i18n="stat.2"></div></div>
          <div><div class="stat-num" data-i18n="stat.3n"></div><div class="stat-label" data-i18n="stat.3"></div></div>
        </div>
      </div>

      <div class="card mock" role="img" aria-label="ตัวอย่างหน้าความคืบหน้าของนักเรียนในระบบ">
        <div class="row between">
          <div>
            <div class="small muted" data-i18n="mock.caption"></div>
            <div class="display" style="font-weight:700;font-size:20px" data-i18n="mock.title"></div>
          </div>
          <span class="tag">เคมี ม.4</span>
        </div>
        <div class="stack" style="gap:8px">
          <div class="row between small"><span data-i18n="mock.r1"></span><span class="muted" data-i18n="mock.r1v"></span></div>
          <div class="bar"><span style="width:80%"></span></div>
        </div>
        <div class="stack" style="gap:8px">
          <div class="row between small"><span data-i18n="mock.r2"></span><span class="muted" data-i18n="mock.r2v"></span></div>
          <div class="bar accent"><span style="width:75%"></span></div>
        </div>
        <div class="stack" style="gap:8px">
          <div class="row between small"><span data-i18n="mock.r3"></span><span class="muted" data-i18n="mock.r3v"></span></div>
          <div class="bar"><span style="width:40%"></span></div>
        </div>
        <div class="row" style="gap:12px;padding:16px;border-radius:16px;background:var(--soft);flex-wrap:nowrap">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand);flex:none"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <div class="small" style="line-height:1.5" data-i18n-html="mock.next"></div>
        </div>
      </div>
    </section>
  </div>

  <section class="band">
    <div class="wrap section stack" style="gap:40px">
      <h2 class="h2" style="max-width:680px" data-i18n="why.title"></h2>
      <div class="grid-auto">
        <div class="reason"><div class="n">01</div><h3 data-i18n="why.1t"></h3><p class="muted" data-i18n="why.1b"></p></div>
        <div class="reason"><div class="n">02</div><h3 data-i18n="why.2t"></h3><p class="muted" data-i18n="why.2b"></p></div>
        <div class="reason"><div class="n">03</div><h3 data-i18n="why.3t"></h3><p class="muted" data-i18n="why.3b"></p></div>
        <div class="reason"><div class="n">04</div><h3 data-i18n="why.4t"></h3><p class="muted" data-i18n="why.4b"></p></div>
      </div>
    </div>
  </section>

  <section id="courses">
    <div class="wrap section stack" style="gap:32px">
      <div class="row between" style="align-items:flex-end;gap:16px">
        <div>
          <div class="eyebrow" data-i18n="courses.eyebrow"></div>
          <h2 class="h2" data-i18n="courses.title"></h2>
        </div>
        <div class="filters" role="group" aria-label="กรองตามระดับชั้น" id="levelFilters"></div>
      </div>
      <div class="grid-courses" id="courseGrid"><div class="spinner" aria-label="กำลังโหลด"></div></div>
      <p class="small muted" data-i18n="courses.note"></p>
    </div>
  </section>

  <section id="online" class="soft">
    <div class="wrap section" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;align-items:center">
      <div class="stack">
        <div class="eyebrow" data-i18n="online.eyebrow"></div>
        <h2 class="h2" data-i18n="online.title"></h2>
        <p class="muted" data-i18n="online.body"></p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
        <div class="feature"><span class="num">1</span><b data-i18n="online.1t"></b><span class="small muted" data-i18n="online.1b"></span></div>
        <div class="feature"><span class="num">2</span><b data-i18n="online.2t"></b><span class="small muted" data-i18n="online.2b"></span></div>
        <div class="feature"><span class="num">3</span><b data-i18n="online.3t"></b><span class="small muted" data-i18n="online.3b"></span></div>
        <div class="feature"><span class="num">4</span><b data-i18n="online.4t"></b><span class="small muted" data-i18n="online.4b"></span></div>
      </div>
    </div>
  </section>

  <section id="teacher">
    <div class="wrap section" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;align-items:center">
      <div class="photo-ph" id="teacherPhoto"><span data-i18n="teacher.photo"></span></div>
      <div class="stack">
        <div class="eyebrow" data-i18n="teacher.eyebrow"></div>
        <h2 class="h2" data-i18n="teacher.name"></h2>
        <p class="muted" data-i18n="teacher.body"></p>
        <ul class="checks">
          <li><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="teacher.c1"></span></li>
          <li><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="teacher.c2"></span></li>
          <li><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="teacher.c3"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="enroll" style="background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
    <div class="wrap section stack" style="gap:32px">
      <h2 class="h2" data-i18n="enroll.title"></h2>
      <ol class="steps">
        <li><span class="n">1</span><b style="font-size:19px" data-i18n="enroll.1t"></b><span class="small muted" data-i18n="enroll.1b"></span></li>
        <li><span class="n">2</span><b style="font-size:19px" data-i18n="enroll.2t"></b><span class="small muted" data-i18n="enroll.2b"></span></li>
        <li><span class="n">3</span><b style="font-size:19px" data-i18n="enroll.3t"></b><span class="small muted" data-i18n="enroll.3b"></span></li>
      </ol>
      <p class="small muted" data-i18n="enroll.note"></p>
    </div>
  </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script type="module" src="/assets/js/pages/home.js"></script>
</body>
</html>
